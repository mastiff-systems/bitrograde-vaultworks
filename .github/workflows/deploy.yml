name: Deploy

# MAS-735: This workflow targets self-hosted runners on the app server
# (146.190.133.156), where deploy-prod.sh / deploy-dev.sh actually live.
# The only registered self-hosted runner (`openclaw-self-hosted`) is on
# the agent-runner host (openclaw), which has neither script, so every
# push-triggered run failed in ~10s with exit 127 and zero real deploys
# ever happened. Real deploys remain manual SSH per the runbook
# (docs/MAS-580 dev workflow). Gated to workflow_dispatch so pushes to
# develop/main stop producing failing Actions runs; re-enable the push
# trigger only after a runner is properly registered on 146.190.133.156.
on:
  workflow_dispatch:

jobs:
  deploy-prod:
    name: Deploy → Production (port 3000)
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, production]
    timeout-minutes: 15
    environment: production

    steps:
      - name: Run production deploy script
        run: bash /home/mastiff/development/bitrograde-vaultworks/scripts/deploy-prod.sh

      - name: Verify production health
        run: |
          sleep 3
          curl -sf http://localhost:3000/health | grep -q '"status":"ok"'
          echo "Production health check passed"

  deploy-dev:
    name: Deploy → Dev (port 3001)
    if: github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, linux, production]
    timeout-minutes: 15
    environment: dev

    steps:
      - name: Run dev deploy script
        run: bash /home/mastiff/bitrograde-vaultworks-dev/scripts/deploy-dev.sh

      - name: Verify dev health
        run: |
          sleep 3
          curl -sf http://localhost:3001/health | grep -q '"status":"ok"'
          echo "Dev health check passed"
