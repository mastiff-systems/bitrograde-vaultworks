version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vaultworks
      POSTGRES_USER: vaultworks
      POSTGRES_PASSWORD: vaultworks
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vaultworks
      MINIO_ROOT_PASSWORD: vaultworks123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  # Creates the bucket on first start
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        sleep 3;
        mc alias set local http://minio:9000 vaultworks vaultworks123;
        mc mb --ignore-existing local/vaultworks-assets;
        mc anonymous set download local/vaultworks-assets;
        exit 0;
      "

  postgres-test:
    image: postgres:16-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: vaultworks_test
      POSTGRES_USER: vaultworks
      POSTGRES_PASSWORD: vaultworks
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  pg_data:
  minio_data:
